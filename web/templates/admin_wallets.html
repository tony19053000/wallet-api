{{define "content"}}
<div class="card">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2 style="font-size: 1.5rem;">Wallets Management</h2>
    <div style="display: flex; gap: 10px;">
      <a href="/admin/wallets" class="btn {{if eq .StatusFilter ""}}btn-primary{{else}}btn-outline{{end}}" style="height: 36px; padding: 0 14px; font-size: 0.85rem;">All</a>
      <a href="/admin/wallets?status=active" class="btn {{if eq .StatusFilter "active"}}btn-primary{{else}}btn-outline{{end}}" style="height: 36px; padding: 0 14px; font-size: 0.85rem;">Active</a>
      <a href="/admin/wallets?status=frozen" class="btn {{if eq .StatusFilter "frozen"}}btn-primary{{else}}btn-outline{{end}}" style="height: 36px; padding: 0 14px; font-size: 0.85rem;">Frozen</a>
    </div>
  </div>

  <table class="table">
    <thead>
      <tr>
        <th>Wallet ID</th>
        <th>User Name</th>
        <th>Handle</th>
        <th>KYC</th>
        <th>Balance</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      {{range .Wallets}}
        <tr>
          <td style="font-family: var(--font-mono); font-size: 0.8rem;">{{.ID}}</td>
          <td><strong>{{.UserName}}</strong></td>
          <td>{{.UserHandle}}</td>
          <td><span class="badge {{if eq .KYCLevel "full"}}badge-success{{else}}badge-warning{{end}}">{{.KYCLevel}}</span></td>
          <td><strong>{{.FormattedBalance}}</strong></td>
          <td>
            <span class="badge {{if eq .Status "active"}}badge-success{{else}}badge-danger{{end}}">
              {{.Status}}
            </span>
          </td>
          <td>
            <a href="/admin/wallets/{{.ID}}" class="btn btn-outline" style="height: 30px; padding: 0 10px; font-size: 0.75rem;">View Ledger</a>
          </td>
        </tr>
      {{end}}
    </tbody>
  </table>
</div>
{{end}}
