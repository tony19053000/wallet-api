{{define "layout_admin"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} — Pocketa Admin Console</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div style="max-width: 1200px; margin: 0 auto; padding: 20px;">
    <header class="card" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <div style="display: flex; align-items: center; gap: 16px;">
        <a href="/admin" class="brand">
          <div class="brand-icon" style="background: var(--secondary);">P</div>
          <span>Risk & Ops Console</span>
        </a>
        <span class="badge badge-danger">ADMIN MODE</span>
      </div>

      <nav class="nav-links">
        <a href="/admin" {{if eq .Page "admin_dashboard"}}style="font-weight:700; color:var(--secondary);"{{end}}>Dashboard</a>
        <a href="/admin/wallets" {{if eq .Page "admin_wallets"}}style="font-weight:700; color:var(--secondary);"{{end}}>Wallets</a>
        <a href="/admin/transfers" {{if eq .Page "admin_transfers"}}style="font-weight:700; color:var(--secondary);"{{end}}>Transfers</a>
        <a href="/admin/reconciliation" {{if eq .Page "admin_reconcile"}}style="font-weight:700; color:var(--secondary);"{{end}}>Reconciliation</a>
        <a href="/app" class="btn btn-outline" style="height:36px; padding:0 14px;">Back to App</a>
      </nav>
    </header>

    <main>
      {{template "content" .}}
    </main>
  </div>
</body>
</html>
{{end}}
