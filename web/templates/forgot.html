{{define "content"}}
<div style="max-width: 420px; margin: 40px auto;">
  <div class="card">
    <h2 style="font-size: 1.6rem; text-align: center; margin-bottom: 8px;">Reset your password</h2>
    <p style="color: var(--muted); text-align: center; font-size: 0.9rem; margin-bottom: 24px;">Enter your registered email address to receive password reset instructions.</p>

    <form onsubmit="event.preventDefault(); showToast('Reset link sent to your registered email address!'); setTimeout(() => window.location.href='/login', 2000);">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" placeholder="riya@pocketa.money" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 8px;">Send Reset Link</button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--muted);">
      Remembered your password? <a href="/login" style="font-weight: 600;">Back to login</a>
    </div>
  </div>
</div>
{{end}}
